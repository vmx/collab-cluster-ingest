[project]
name = "collab-cluster-torrentizer"
version = "0.1.0"
description = "Tail Jetstream for Sentinel-2 matadisco records and package true-color imagery as BitTorrent v2 torrents"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
# Upper-bounded because libtorrent only ships wheels up to cp313 (no sdist to build from).
requires-python = ">=3.11,<3.14"
dependencies = [
    "websockets>=15.0",
    "httpx>=0.28",
    "libtorrent>=2.0",
    "rasterio>=1.4.4",
]

[dependency-groups]
dev = [
    "numpy>=2.4.6",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.scripts]
collab-cluster-torrentizer = "collab_cluster_torrentizer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collab_cluster_torrentizer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
